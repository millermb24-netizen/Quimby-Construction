{% extends 'base.html' %}{% block title %}Edit {{template.name}} · Quimby{% endblock %}
{% block content %}
<a class="back-link" href="{{url_for('report_templates')}}">← Back to report templates</a>
<div class="page-heading"><div><p class="eyebrow">REUSABLE CONTENT</p><h1>Edit {{template.name}}</h1><p class="muted">Existing reports keep their saved wording when this template changes.</p></div></div>
<section class="panel"><form method="post"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Name<input name="name" maxlength="120" required value="{{template.name}}"></label><label>Services performed starter<textarea name="services_intro" maxlength="12000" rows="6">{{template.services_intro}}</textarea></label><label>Findings starter<textarea name="findings_intro" maxlength="12000" rows="6">{{template.findings_intro}}</textarea></label><label>Recommendations starter<textarea name="recommendations_intro" maxlength="12000" rows="6">{{template.recommendations_intro}}</textarea></label><label class="check"><input type="checkbox" name="is_default" {% if template.is_default %}checked{% endif %}>Use as the default for new reports</label><div class="form-footer"><a class="button" href="{{url_for('report_templates')}}">Cancel</a><button class="primary">Save template changes</button></div></form></section>
{% endblock %}
