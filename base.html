<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quimby Construction Beta</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><header><strong>QUIMBY CONSTRUCTION</strong><span>PRIVATE BETA · {{ config.get('APP_ENV','DEVELOPMENT') }}</span>{% if current_user.is_authenticated %}<form action="{{ url_for('logout') }}" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button>Log out</button></form>{% endif %}</header><main>{% for msg in get_flashed_messages() %}<div class="notice">{{msg}}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
